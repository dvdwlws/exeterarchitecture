<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exeter Architectural Trail</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f4f0;
    --bg-tertiary: #edecea;
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-tertiary: #888780;
    --border-light: rgba(0,0,0,0.12);
    --border-mid: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --accent: #1D9E75;
    --accent-dark: #0F6E56;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1c1c1a;
      --bg-secondary: #252522;
      --bg-tertiary: #2e2e2b;
      --text-primary: #f0ede8;
      --text-secondary: #a8a49e;
      --text-tertiary: #6e6c67;
      --border-light: rgba(255,255,255,0.1);
      --border-mid: rgba(255,255,255,0.18);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 0;
  }

  .page-header {
    background: var(--bg-primary);
    border-bottom: 0.5px solid var(--border-light);
    padding: 1.5rem 2rem 1.25rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .page-header h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .page-header p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .progress-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .progress-label {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-right: 4px;
  }

  .progress-dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 1px solid var(--border-mid);
    background: var(--bg-secondary);
    transition: background 0.25s, transform 0.15s;
    cursor: pointer;
  }
  .progress-dot:hover { transform: scale(1.3); }
  .progress-dot.active { background: #1D9E75; border-color: #0F6E56; }
  .progress-dot.complete { background: #0F6E56; border-color: #085041; }

  .timeline-overview {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
    border: 0.5px solid var(--border-light);
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--bg-primary);
  }

  .timeline-era {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.4;
    transition: background 0.15s;
    border-right: 0.5px solid var(--border-light);
    color: var(--text-secondary);
  }
  .timeline-era:last-child { border-right: none; }
  .timeline-era:hover { background: var(--bg-secondary); }
  .timeline-era.sel { background: var(--bg-secondary); color: var(--text-primary); font-weight: 600; }
  .timeline-era .era-year { font-size: 9px; color: var(--text-tertiary); display: block; font-weight: 400; margin-bottom: 2px; }

  .era-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }

  .stop-card {
    background: var(--bg-primary);
    border: 0.5px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1rem;
  }

  .stop-number {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 600;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .stop-name {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
    line-height: 1.2;
  }

  .stop-location {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 14px;
  }

  .stop-description {
    font-size: 15px;
    color: var(--text-primary);
    line-height: 1.75;
    margin-bottom: 20px;
  }

  .map-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #185FA5;
    text-decoration: none;
    border: 0.5px solid #B5D4F4;
    border-radius: var(--radius-md);
    padding: 6px 14px;
    margin-bottom: 18px;
    transition: background 0.15s;
    font-weight: 500;
  }
  .map-link:hover { background: #E6F1FB; }

  @media (prefers-color-scheme: dark) {
    .map-link { color: #85B7EB; border-color: #185FA5; }
    .map-link:hover { background: #0C447C22; }
  }

  .section-heading {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 10px;
  }

  .style-features {
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    padding: 1rem 1.25rem;
    margin-bottom: 18px;
  }

  .feature-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--text-primary);
    line-height: 1.55;
  }
  .feature-item:last-child { margin-bottom: 0; }

  .feature-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }

  .task-box {
    border: 0.5px solid var(--border-mid);
    border-radius: var(--radius-md);
    padding: 1rem 1.25rem;
    margin-bottom: 18px;
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.55;
    cursor: pointer;
    color: var(--text-primary);
  }
  .task-item:last-child { margin-bottom: 0; }
  .task-item input[type=checkbox] {
    margin-top: 2px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: #1D9E75;
    width: 16px; height: 16px;
  }
  .task-item.done span {
    text-decoration: line-through;
    color: var(--text-tertiary);
  }

  .sketch-prompt {
    border: 1.5px dashed var(--border-mid);
    border-radius: var(--radius-md);
    padding: 1rem 1.25rem;
    margin-bottom: 4px;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.65;
  }
  .sketch-prompt strong {
    display: block;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 5px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .task-count {
    font-size: 13px;
    color: var(--text-tertiary);
    background: var(--bg-secondary);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .nav-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 1rem;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--radius-md);
    border: 0.5px solid var(--border-mid);
    background: var(--bg-primary);
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    font-family: inherit;
  }
  .btn:hover { background: var(--bg-secondary); }
  .btn:active { transform: scale(0.98); }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-dark);
    flex: 1;
  }
  .btn.primary:hover { background: var(--accent-dark); }

  .completion-panel {
    background: var(--bg-primary);
    border: 0.5px solid var(--border-light);
    border-radius: var(--radius-lg);
    text-align: center;
    padding: 3rem 2rem;
  }
  .completion-panel h2 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .completion-panel p {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.75;
    margin-bottom: 1rem;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .stars { font-size: 30px; margin-bottom: 1rem; letter-spacing: 4px; }

  .reflection-box {
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    padding: 1.25rem;
    margin: 1.5rem auto 0;
    max-width: 520px;
    text-align: left;
  }
  .reflection-box h3 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    margin-bottom: 10px;
  }
  .reflection-box p {
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .reflection-box p:last-child { margin-bottom: 0; }

  .footer-credit {
    text-align: center;
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 3rem;
  }
  .footer-credit a { color: var(--text-tertiary); }

  @media (max-width: 600px) {
    .page-header { padding: 1rem; }
    .container { padding: 1.25rem 1rem 3rem; }
    .stop-card { padding: 1.25rem 1rem; }
    .stop-name { font-size: 20px; }
    .timeline-era { font-size: 9px; padding: 8px 3px; }
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>Exeter Architectural Trail</h1>
  <p>Walk through 2,000 years of building history — 8 stops across the city</p>
</div>

<div class="container">
  <div id="app"></div>
  <div class="footer-credit">
    Based on Historic England's National Heritage List for England &nbsp;·&nbsp;
    <a href="https://historicengland.org.uk/local/locations/exeter/" target="_blank">historicengland.org.uk</a>
  </div>
</div>

<script>
const stops = [
  {
    era: "Roman", eraYears: "AD 55 – 410",
    eraColor: "#633806", eraBg: "#FAEEDA", dotColor: "#BA7517",
    name: "Exeter city walls",
    location: "Near Northernhay Gardens & South Street",
    googleMaps: "https://maps.google.com/?q=Exeter+Roman+City+Wall+Northernhay",
    description: "Exeter's Roman walls are among the most complete Roman urban defences in England. The Romans founded Isca Dumnoniorum here around AD 55, and by the late 2nd century had constructed massive stone walls encircling the settlement. Look for the distinctive large red sandstone blocks, some still standing to considerable height.",
    style: "Roman military & civic",
    features: [
      "Thick stone walls built for defence — look for the sheer scale",
      "Red sandstone sourced locally — notice the warm earthy colour",
      "Near-rectangular grid layout of the original Roman town underneath",
      "Bastions (projecting towers) added to reinforce weak points"
    ],
    tasks: [
      "Find a section of wall and estimate how tall it is",
      "Touch the stone — is it rough or smooth? Why might that be?",
      "Spot where Roman masonry meets later medieval repair work",
      "Photograph the thickest section you can find"
    ],
    sketchPrompt: "Sketch a cross-section of the wall showing how thick it is compared to a person standing beside it."
  },
  {
    era: "Norman", eraYears: "AD 1068 onward",
    eraColor: "#3C3489", eraBg: "#EEEDFE", dotColor: "#7F77DD",
    name: "Rougemont Castle gatehouse",
    location: "Castle Street, city centre",
    googleMaps: "https://maps.google.com/?q=Rougemont+Castle+Exeter",
    description: "Built in 1068 following William the Conqueror's defeat of rebellious Exonians, Rougemont Castle is one of the earliest Norman structures in England. The original gatehouse still survives and is a rare chance to see what William's builders constructed immediately after the Conquest.",
    style: "Norman military",
    features: [
      "Rounded arches — the Norman hallmark (contrast with later pointed Gothic arches)",
      "Massive, thick walls with small window openings for strength",
      "Simple, heavy proportions — power over elegance",
      "Red volcanic stone (breccia) quarried on the castle hill itself"
    ],
    tasks: [
      "Count and draw the rounded arches in the gatehouse",
      "Compare the window size to a modern window — why so small?",
      "Look for the line where original Norman stonework ends and later repairs begin",
      "Find evidence of the original moat or defensive ditch"
    ],
    sketchPrompt: "Draw a Norman arch and label why its rounded shape differs from a Gothic pointed arch."
  },
  {
    era: "Medieval", eraYears: "AD 1114 – 1400s",
    eraColor: "#085041", eraBg: "#E1F5EE", dotColor: "#1D9E75",
    name: "Exeter Cathedral",
    location: "Cathedral Close",
    googleMaps: "https://maps.google.com/?q=Exeter+Cathedral",
    description: "One of the great cathedrals of England, Exeter Cathedral contains the longest unbroken stretch of Gothic vaulting in the world. The twin Norman towers survive from the 12th century, but the main body was transformed in the Decorated Gothic style from 1270–1369. This building shows how architectural ambition grew across medieval centuries.",
    style: "Gothic Decorated",
    features: [
      "Pointed arches everywhere — the defining feature of Gothic style",
      "Spectacular fan vaulting on the ceiling — an engineering wonder in stone",
      "Large windows with 'tracery' (decorative stonework patterns) to let in light",
      "Flying buttresses on the outside transferring the weight of the roof outwards",
      "Elaborately carved West Front with hundreds of figures in niches"
    ],
    tasks: [
      "Stand inside and look up — count how many rib vault 'arms' meet at one boss",
      "Find a flying buttress outside and sketch how it works structurally",
      "Compare a Norman tower window with a Gothic nave window — what changed?",
      "Spot three different types of carved decoration (foliage, figures, geometric)"
    ],
    sketchPrompt: "Draw a section of the ceiling vault and label the ribs, boss (central keystone), and how they direct weight downward."
  },
  {
    era: "Tudor & Stuart", eraYears: "1540 – 1700",
    eraColor: "#3C3489", eraBg: "#EEEDFE", dotColor: "#7F77DD",
    name: "No. 227 High Street (Lakeland building)",
    location: "High Street",
    googleMaps: "https://maps.google.com/?q=227+High+Street+Exeter",
    description: "Built in the 1660s for one of Exeter's prosperous wool merchants, this timber-framed facade is one of the few surviving examples of early modern merchant architecture in the city. Exeter was then the third or fourth busiest port in England. Only the original facade survives — the rest was rebuilt in the 1970s — but it shows how wealth was displayed through architecture.",
    style: "Merchant vernacular / Timber-frame",
    features: [
      "Exposed timber frame — oak beams forming the structural skeleton",
      "Jettied upper floors (upper storeys projecting out over the street)",
      "Small leaded windows with multiple panes of glass — glass was expensive",
      "Ornate carved timber details displaying the owner's wealth and status"
    ],
    tasks: [
      "Identify which parts of the building are genuinely old (the facade) vs modern",
      "Measure how far the upper floor projects over the pavement — jettying!",
      "Find the carved decorative details on the timber frame",
      "Count the number of panes in one window — why so many small ones?"
    ],
    sketchPrompt: "Sketch the facade and label: timber frame, jettied floor, leaded windows, and carved detail."
  },
  {
    era: "Georgian", eraYears: "1714 – 1830",
    eraColor: "#185FA5", eraBg: "#E6F1FB", dotColor: "#378ADD",
    name: "Southernhay West terraces",
    location: "Southernhay West",
    googleMaps: "https://maps.google.com/?q=Southernhay+West+Exeter",
    description: "Built in the 1790s, these Georgian townhouses show Exeter's role as an elegant retreat for the gentry. Two of the original four terraces survive — the others were destroyed in the 1942 Blitz. Georgian architecture prized order, symmetry, and classical proportion above all.",
    style: "Georgian classical",
    features: [
      "Perfect symmetry — every window and door arranged in balance",
      "Sash windows with thin glazing bars — elegant proportions",
      "Classical details: pilasters, cornices, pediments borrowed from ancient Greece and Rome",
      "Brick construction with stucco (plaster) dressing in white or cream",
      "Regular, repeating bays along the terrace — rhythm and order"
    ],
    tasks: [
      "Count windows across one terrace — are they perfectly symmetrical?",
      "Find the classical columns or pilasters and identify their order (Doric, Ionic, Corinthian?)",
      "Measure how tall a ground-floor window is compared to a first-floor one",
      "Note the ironwork railings and boot scrapers — what do they tell us about life here?"
    ],
    sketchPrompt: "Draw the elevation (front view) of one terrace bay, labelling: sash window, pilasters, cornice, and basement railings."
  },
  {
    era: "Victorian", eraYears: "1837 – 1901",
    eraColor: "#993C1D", eraBg: "#FAECE7", dotColor: "#D85A30",
    name: "Royal Albert Memorial Museum",
    location: "Queen Street",
    googleMaps: "https://maps.google.com/?q=Royal+Albert+Memorial+Museum+Exeter",
    description: "Built in the 1860s, the RAMM is an exuberant example of Victorian Gothic Revival — a deliberate return to medieval architectural forms at a time of industrial confidence. Architect John Haywood won a competition with a design inspired by Oxford's Natural History Museum. The Victorians believed Gothic was the true English style.",
    style: "Victorian Gothic Revival",
    features: [
      "Pointed Gothic arches returned — but now in a new industrial context",
      "Polychromatic brickwork — different coloured stones and bricks for decoration",
      "Large windows with elaborate stone tracery",
      "Rich carved ornament covering almost every surface",
      "Asymmetrical roofline with towers and spires for picturesque effect"
    ],
    tasks: [
      "Count how many different types of stone or brick colour are used on the facade",
      "Find three examples of carved naturalistic ornament (leaves, animals, etc.)",
      "Compare the Gothic arches here with the cathedral's — what's different?",
      "Look for cast iron elements — where has Victorian industry crept in?"
    ],
    sketchPrompt: "Sketch a section of the facade showing how different coloured materials are arranged decoratively."
  },
  {
    era: "Post-war modernism", eraYears: "1945 – 1975",
    eraColor: "#3B6D11", eraBg: "#EAF3DE", dotColor: "#639922",
    name: "Exeter Civic Centre",
    location: "Paris Street (opposite bus station)",
    googleMaps: "https://maps.google.com/?q=Exeter+Civic+Centre+Paris+Street",
    description: "Built in 1969, the Civic Centre is Exeter's most prominent example of Brutalism — a movement that celebrated raw, honest materials and rejected historical ornament. After the Blitz destroyed 40 acres of the city, planner Thomas Sharp reimagined Exeter for the modern age. This building reflects the progressive confidence of post-war public architecture.",
    style: "Brutalism",
    features: [
      "Raw, exposed concrete (béton brut) — honest about its own material",
      "Bold, heavy geometric forms — designed to impress through mass",
      "Repetitive structural grid visible on the exterior",
      "Functional, unornamented surfaces — decoration considered dishonest",
      "Elevated walkways and separation of pedestrian/vehicle traffic"
    ],
    tasks: [
      "Find where the raw concrete texture changes — why are some areas smoother?",
      "Spot the structural grid — count the repeated bays along one facade",
      "How does this building make you feel compared to the Georgian terraces?",
      "Look for the original signage or lettering — what typeface style was used?"
    ],
    sketchPrompt: "Draw the basic geometric massing of the building — just the bold shapes, no detail. How would you describe the silhouette?"
  },
  {
    era: "Post-war reconstruction", eraYears: "1950s – 2000s",
    eraColor: "#3B6D11", eraBg: "#EAF3DE", dotColor: "#639922",
    name: "Princesshay",
    location: "Princesshay shopping area, city centre",
    googleMaps: "https://maps.google.com/?q=Princesshay+Exeter",
    description: "The original Princesshay was Britain's first pedestrianised shopping street, designed by Thomas Sharp in his 1946 Exeter Phoenix redevelopment plan. Sharp wanted to rebuild Exeter as a proper urban centre. The area was later redeveloped in 2007, but the pedestrianised concept — radical in its day — endures. Look for evidence of both the 1950s original plan and the later 2007 redevelopment.",
    style: "Post-war civic planning / Contemporary commercial",
    features: [
      "Pedestrianisation — removing cars from the shopping street was revolutionary in 1950",
      "Human scale — buildings designed to relate to a person on foot",
      "Mix of post-war brick modernism and later contemporary infill",
      "Planned open spaces and sight-lines — urban design rather than organic growth",
      "The 2007 redevelopment used a contextual brick language to blend with surroundings"
    ],
    tasks: [
      "Find a building that looks 1950s vs one that looks 2000s — what are the differences?",
      "Note how the space makes you move — how does the layout guide pedestrians?",
      "Look for any remnants of pre-war street patterns (a small church, alley, or building)",
      "Compare brick colours — does the newer development try to match the old?"
    ],
    sketchPrompt: "Draw a bird's-eye plan view of the pedestrianised area. Mark where cars stop, where people walk, and any open squares."
  }
];

let current = 0;
let taskStates = stops.map(s => s.tasks.map(() => false));
let finished = false;

function renderProgress() {
  const done = taskStates.flat().filter(Boolean).length;
  const total = taskStates.flat().length;
  return `<div class="progress-bar">
    <span class="progress-label">Stops:</span>
    ${stops.map((s, i) => `
      <div class="progress-dot ${i === current ? 'active' : taskStates[i].every(Boolean) ? 'complete' : ''}"
           onclick="goTo(${i})" title="Stop ${i+1}: ${s.name}"
           style="${i === current ? `background:${s.dotColor};border-color:${s.dotColor}` : taskStates[i].every(Boolean) ? 'background:#085041;border-color:#04342C' : ''}"></div>
    `).join('')}
    <span class="task-count" style="margin-left: auto;">${done}/${total} tasks</span>
  </div>`;
}

function renderTimeline() {
  return `<div class="timeline-overview">
    ${stops.map((s, i) => `
      <div class="timeline-era ${i === current ? 'sel' : ''}" onclick="goTo(${i})">
        <span class="era-year">${s.eraYears.split('–')[0].trim()}</span>
        ${s.era.split(' ')[0]}
      </div>
    `).join('')}
  </div>`;
}

function renderStop(i) {
  const s = stops[i];
  const done = taskStates[i].filter(Boolean).length;
  return `
    <div style="margin-bottom: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <span class="era-badge" style="background:${s.eraBg};color:${s.eraColor};">${s.era} · ${s.eraYears}</span>
      <span class="task-count">${done}/${s.tasks.length} tasks</span>
    </div>
    <div class="stop-card">
      <div class="stop-number">Stop ${i + 1} of ${stops.length}</div>
      <div class="stop-name">${s.name}</div>
      <div class="stop-location">📍 ${s.location}</div>
      <a class="map-link" href="${s.googleMaps}" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 14 8 14s8-8.75 8-14a8 8 0 0 0-8-8z"/></svg>
        Open in Google Maps
      </a>
      <div class="stop-description">${s.description}</div>
      <div class="style-features">
        <div class="section-heading">What to look for · ${s.style}</div>
        ${s.features.map(f => `
          <div class="feature-item">
            <div class="feature-dot" style="background:${s.dotColor};"></div>
            <span>${f}</span>
          </div>
        `).join('')}
      </div>
      <div class="task-box">
        <div class="section-heading">Your tasks at this stop</div>
        ${s.tasks.map((t, ti) => `
          <label class="task-item ${taskStates[i][ti] ? 'done' : ''}">
            <input type="checkbox" ${taskStates[i][ti] ? 'checked' : ''} onchange="toggleTask(${i},${ti})">
            <span>${t}</span>
          </label>
        `).join('')}
      </div>
      <div class="sketch-prompt">
        <strong>✏ Sketch challenge</strong>
        ${s.sketchPrompt}
      </div>
    </div>
    <div class="nav-row">
      ${i > 0
        ? `<button class="btn" onclick="goTo(${i-1})">← Back</button>`
        : '<span></span>'}
      ${i < stops.length - 1
        ? `<button class="btn primary" onclick="goTo(${i+1})">Next: ${stops[i+1].name.split('(')[0].trim()} →</button>`
        : `<button class="btn primary" onclick="finish()">Complete the tour →</button>`}
    </div>
  `;
}

function renderComplete() {
  const done = taskStates.flat().filter(Boolean).length;
  const total = taskStates.flat().length;
  const pct = Math.round((done / total) * 100);
  return `
    <div class="completion-panel">
      <div class="stars">★★★</div>
      <h2>Tour complete!</h2>
      <p>You've walked through ${stops.length} architectural stops and over 2,000 years of Exeter's built history — from Roman defensive walls to Brutalist civic ambition.</p>
      <p>Tasks completed: <strong>${done} / ${total} (${pct}%)</strong></p>
      <div class="reflection-box">
        <h3>Reflection questions</h3>
        <p>1. Which building style surprised you most, and why?</p>
        <p>2. How did the Blitz of 1942 change the character of Exeter's city centre?</p>
        <p>3. Compare any two buildings from different eras. How do their materials and decorative choices reflect the values of their time?</p>
        <p>4. If you were commissioning a new building in Exeter today, what style would you choose and why?</p>
      </div>
      <div class="nav-row" style="justify-content: center; margin-top: 1.5rem;">
        <button class="btn" onclick="goTo(0)">Start again</button>
      </div>
    </div>
  `;
}

function goTo(i) {
  current = i;
  finished = false;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleTask(si, ti) {
  taskStates[si][ti] = !taskStates[si][ti];
  render();
}

function finish() {
  finished = true;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  const app = document.getElementById('app');
  if (finished) {
    app.innerHTML = renderProgress() + renderComplete();
  } else {
    app.innerHTML = renderProgress() + renderTimeline() + renderStop(current);
  }
}

render();
</script>
</body>
</html>
